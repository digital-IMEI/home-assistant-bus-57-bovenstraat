name: Validate and publish integration

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository structure and brands
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: "description topics"

  validate-code:
    name: Home Assistant 2026.8.2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install validation dependencies
        run: >-
          python -m pip install
          "homeassistant==2026.8.2"
          "pyzmq==27.2.0"
          pytest
          pytest-asyncio
          ruff

      - name: Validate metadata and brand assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          from PIL import Image

          root = Path.cwd()
          manifest = json.loads(
              (root / "custom_components/bus_57_bovenstraat/manifest.json").read_text()
          )
          hacs = json.loads((root / "hacs.json").read_text())
          assert re.fullmatch(r"\d+\.\d+\.\d+", manifest["version"])
          assert f"## Version {manifest['version']}" in (root / "README.md").read_text()
          assert hacs["homeassistant"] == "2026.8.2"

          expected_sizes = {
              "icon.png": (256, 256),
              "icon@2x.png": (512, 512),
              "logo.png": (256, 256),
              "logo@2x.png": (512, 512),
          }
          for brand_dir in (
              root / "brand",
              root / "custom_components/bus_57_bovenstraat/brand",
          ):
              for filename, expected_size in expected_sizes.items():
                  with Image.open(brand_dir / filename) as image:
                      assert image.format == "PNG"
                      assert image.size == expected_size
          PY

      - name: Compile, lint and test
        run: |
          python -m compileall -q custom_components
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest

  release:
    name: Publish HACS release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-hacs
      - validate-code
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read integration version
        id: version
        shell: bash
        run: |
          version=$(jq -r '.version' custom_components/bus_57_bovenstraat/manifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes

          # Force a new repository ETag so HACS discovers the release quickly.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Refresh HACS metadata for $VERSION [skip ci]"
          git push
